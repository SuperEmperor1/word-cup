name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 核心数学测试 (合成数据, 无需真实数据集)
        run: python tests/test_models.py
      - name: 外部数据层测试
        run: python tests/test_external.py
